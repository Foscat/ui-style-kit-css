name: Feature request
description: Propose an enhancement to styles, themes, docs, or tooling
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your preferred approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative options you evaluated.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility impact
      description: Mention any expected breaking or migration implications.
