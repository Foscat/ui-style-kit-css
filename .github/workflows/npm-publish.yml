name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish (example: v1.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_ref.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag could not be resolved."
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release_ref.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Validate release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Missing release tag name in event payload."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must start with 'v' (for example: v1.0.5)."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PACKAGE_VERSION}'."
            echo "::error::Update package.json to ${RELEASE_VERSION}, commit, retag, and create a new release."
            exit 1
          fi

          echo "Release tag and package.json version are aligned (${PACKAGE_VERSION})."

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Build dist assets
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npm run test:e2e:install:ci

      - name: Run Playwright tests
        run: npm run test:e2e

  publish-npm:
    name: Publish Package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Ensure npm token exists
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
