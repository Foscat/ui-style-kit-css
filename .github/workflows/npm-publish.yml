name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag or version to publish (example: v1.2.0 or 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_ref.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            if [[ "${RELEASE_TAG}" != v* ]]; then
              RELEASE_TAG="v${RELEASE_TAG}"
            fi
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag could not be resolved."
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release_ref.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Validate release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Missing release tag name in event payload."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must start with 'v' (for example: v1.0.5)."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PACKAGE_VERSION}'."
            echo "::error::Update package.json to ${RELEASE_VERSION}, commit, retag, and create a new release."
            exit 1
          fi

          echo "Release tag and package.json version are aligned (${PACKAGE_VERSION})."

      - name: Install dependencies
        run: npm ci

      - name: Run publish readiness checks
        run: npm run check

  publish-npm:
    name: Publish Package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      # Release verification packs the immutable Task 4 companion artifacts
      # selected by the checked-in compatibility contract.
      - name: Resolve immutable ecosystem fixture sources
        id: ecosystem_sources
        shell: bash
        run: node scripts/write-ecosystem-workflow-outputs.mjs

      - name: Check if version already exists on npm
        id: npm_version_check
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet. Proceeding to publish."
          fi

      # Publishing validates the same remote companion objects after they are
      # pushed, so a release never substitutes a stale registry artifact.
      - name: Require pushed companion commits before publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        shell: bash
        env:
          INTERACTIVE_REPOSITORY: ${{ steps.ecosystem_sources.outputs.interactive_repository }}
          INTERACTIVE_REVISION: ${{ steps.ecosystem_sources.outputs.interactive_revision }}
          LAYOUT_REPOSITORY: ${{ steps.ecosystem_sources.outputs.layout_repository }}
          LAYOUT_REVISION: ${{ steps.ecosystem_sources.outputs.layout_revision }}
        run: |
          set -euo pipefail
          for source in "${INTERACTIVE_REPOSITORY}:${INTERACTIVE_REVISION}" "${LAYOUT_REPOSITORY}:${LAYOUT_REVISION}"; do
            repository="${source%%:*}"
            revision="${source##*:}"
            fixture_dir="$(mktemp -d)"
            if ! git init --bare "${fixture_dir}" >/dev/null || ! git -C "${fixture_dir}" fetch --no-tags --depth=1 "https://github.com/${repository}.git" "${revision}" >/dev/null 2>&1 || ! git -C "${fixture_dir}" cat-file -e "${revision}^{commit}"; then
              echo "::error::${repository}@${revision} is unavailable. Push the companion commit and verify its remote object before publish verification."
              rm -rf "${fixture_dir}"
              exit 1
            fi
            rm -rf "${fixture_dir}"
          done

      - name: Ensure npm token exists
        if: steps.npm_version_check.outputs.already_published != 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi

      - name: Verify npm token can publish package
        if: steps.npm_version_check.outputs.already_published != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          NPM_AUTH_LOG="$(mktemp)"
          if ! NPM_USER="$(npm whoami --registry https://registry.npmjs.org/ 2>"${NPM_AUTH_LOG}")"; then
            cat "${NPM_AUTH_LOG}" >&2
            rm -f "${NPM_AUTH_LOG}"
            echo "::error::Unable to authenticate with npm using NPM_TOKEN. Replace the repository secret with a valid npm automation or granular access token for an owner of '${PACKAGE_NAME}'."
            exit 1
          fi
          rm -f "${NPM_AUTH_LOG}"
          echo "Authenticated to npm as ${NPM_USER}."

          if ! npm owner ls "${PACKAGE_NAME}" --registry https://registry.npmjs.org/ | awk '{print $1}' | grep -Fx "${NPM_USER}" >/dev/null; then
            echo "::error::NPM_TOKEN authenticates as '${NPM_USER}', which is not an npm owner of '${PACKAGE_NAME}'."
            echo "::error::Replace the repository NPM_TOKEN secret with an automation or granular token for a package owner with publish access, or add '${NPM_USER}' as an owner before rerunning this workflow."
            exit 1
          fi

      # Stage the immutable companion sources so the explicit publish preflight
      # packs the coordinated artifacts and scans their maintained documentation.
      - name: Checkout Layout Style CSS for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.ecosystem_sources.outputs.layout_repository }}
          ref: ${{ steps.ecosystem_sources.outputs.layout_revision }}
          path: _ecosystem/Layout-Style-CSS

      - name: Checkout Interactive Surface CSS documentation for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.ecosystem_sources.outputs.interactive_repository }}
          ref: ${{ steps.ecosystem_sources.outputs.interactive_revision }}
          path: _ecosystem/Interactive-Surface-CSS

      # Layout's prepack contract tests inspect its installed UI dependency, so
      # install its locked dependency graph before packing it as an ecosystem fixture.
      - name: Install Layout Style CSS dependencies for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        working-directory: _ecosystem/Layout-Style-CSS
        run: npm ci

      - name: Install Interactive Surface CSS dependencies for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        working-directory: _ecosystem/Interactive-Surface-CSS
        run: npm ci

      # Explicit candidate mode exempts only the UI package being published. The
      # release-alignment workflow owns browser and clean-install matrix proof,
      # so publish recovery stays focused on deterministic package readiness.
      - name: Run ecosystem release preflight
        if: steps.npm_version_check.outputs.already_published != 'true'
        run: npm run release:preflight -- --candidate-package ui-style-kit-css --layout-repo $GITHUB_WORKSPACE/_ecosystem/Layout-Style-CSS --interactive-repo $GITHUB_WORKSPACE/_ecosystem/Interactive-Surface-CSS --layout-docs-repo $GITHUB_WORKSPACE/_ecosystem/Layout-Style-CSS --interactive-docs-repo $GITHUB_WORKSPACE/_ecosystem/Interactive-Surface-CSS --skip-clean-install

      - name: Publish package
        if: steps.npm_version_check.outputs.already_published != 'true'
        run: npm publish --access public --ignore-scripts --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          UI_STYLE_KIT_LAYOUT_REPO: ${{ github.workspace }}/_ecosystem/Layout-Style-CSS
          UI_STYLE_KIT_LAYOUT_DOCS_REPO: ${{ github.workspace }}/_ecosystem/Layout-Style-CSS
          UI_STYLE_KIT_INTERACTIVE_REPO: ${{ github.workspace }}/_ecosystem/Interactive-Surface-CSS
          UI_STYLE_KIT_INTERACTIVE_DOCS_REPO: ${{ github.workspace }}/_ecosystem/Interactive-Surface-CSS
