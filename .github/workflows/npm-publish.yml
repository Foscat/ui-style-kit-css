name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag or version to publish (example: v1.2.0 or 1.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_ref.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            if [[ "${RELEASE_TAG}" != v* ]]; then
              RELEASE_TAG="v${RELEASE_TAG}"
            fi
          else
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag could not be resolved."
            exit 1
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release_ref.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Validate release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Missing release tag name in event payload."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must start with 'v' (for example: v1.0.5)."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${PACKAGE_VERSION}'."
            echo "::error::Update package.json to ${RELEASE_VERSION}, commit, retag, and create a new release."
            exit 1
          fi

          echo "Release tag and package.json version are aligned (${PACKAGE_VERSION})."

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Build dist assets
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npm run test:e2e:install:ci

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Run curated visual checks
        run: npm run test:visual

      - name: Run full UI matrix
        run: npm run test:matrix

  publish-npm:
    name: Publish Package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Check if version already exists on npm
        id: npm_version_check
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet. Proceeding to publish."
          fi

      - name: Ensure npm token exists
        if: steps.npm_version_check.outputs.already_published != 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi

      # npm runs prepublishOnly before publishing, and this package's release gate
      # exercises Playwright coverage. Install browsers in the publish job too so
      # manual recovery runs validate the same tagged package instead of failing
      # before the registry write.
      - name: Install Playwright browser for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        run: npm run test:e2e:install:ci

      # The package prepublish gate runs packed ecosystem checks against the
      # staged Layout Style CSS 2.1 line before this UI package reaches npm.
      - name: Checkout Layout Style CSS for publish verification
        if: steps.npm_version_check.outputs.already_published != 'true'
        uses: actions/checkout@v7
        with:
          repository: Foscat/Layout-Style-CSS
          ref: 2.1.0
          path: _ecosystem/Layout-Style-CSS

      - name: Publish package
        if: steps.npm_version_check.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          UI_STYLE_KIT_LAYOUT_REPO: ${{ github.workspace }}/_ecosystem/Layout-Style-CSS
