name: Publish reviewed 2.9.0 artifact only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact signed and independently reviewed 2.9.0 source commit
        required: true
        type: string
      approval_pr:
        description: Merged pull request with STE-Adam approval of this exact head
        required: true
        type: string
      complete_only:
        description: Restore a previously published artifact and finish readback and release creation without publishing
        required: false
        default: false
        type: boolean
      producer_run:
        description: Workflow run that uploaded the artifact (required for complete_only)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: guided-corners-2.9.0-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      APPROVAL_PR: ${{ inputs.approval_pr }}
      PRODUCER_RUN: ${{ inputs.producer_run || github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # trusted main controller
        with:
          persist-credentials: false
      - name: Retain trusted controller before candidate checkout
        run: cp scripts/publish-guided-corners.mjs "$RUNNER_TEMP/publish-guided-corners.mjs"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Admit exact source and independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/publish-guided-corners.mjs" admit
      - name: Validate continuation run
        if: ${{ inputs.complete_only }}
        env:
          PRODUCER_RUN_INPUT: ${{ inputs.producer_run }}
        run: |
          if [[ ! "$PRODUCER_RUN_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "complete_only requires the workflow run that uploaded the artifact" >&2
            exit 1
          fi
      - name: Install build dependencies without lifecycle hooks
        if: ${{ !inputs.complete_only && github.run_attempt == 1 }}
        run: npm ci --ignore-scripts
      - name: Reproduce generated assets without tests
        if: ${{ !inputs.complete_only && github.run_attempt == 1 }}
        run: |
          node scripts/build.mjs
          git diff --exit-code
          node scripts/check-package.mjs
      - name: Pack and attest only the published payload
        if: ${{ !inputs.complete_only && github.run_attempt == 1 }}
        run: |
          npm pack --ignore-scripts --json > guided-corners-pack.json
          node "$RUNNER_TEMP/publish-guided-corners.mjs" attest
      - name: Persist the exact artifact and checksum receipt
        if: ${{ !inputs.complete_only && github.run_attempt == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guided-corners-${{ env.SOURCE_SHA }}
          path: |
            ui-style-kit-css-2.9.0.tgz
            guided-corners-artifact.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Validate trusted artifact producer
        if: ${{ inputs.complete_only || github.run_attempt > 1 }}
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/publish-guided-corners.mjs" validate-producer
      - name: Restore the original published artifact for continuation only
        if: ${{ inputs.complete_only || github.run_attempt > 1 }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          # Exactly one admitted ID: restore its payload at the trusted verifier root.
          merge-multiple: true
          path: .
          run-id: ${{ env.PRODUCER_RUN }}
          github-token: ${{ github.token }}
      - name: Verify the restored tarball and checksum receipt
        if: ${{ inputs.complete_only || github.run_attempt > 1 }}
        run: node "$RUNNER_TEMP/publish-guided-corners.mjs" verify-artifact
      - name: Publish using the existing package-owner credential
        if: ${{ !inputs.complete_only && github.run_attempt == 1 }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publisher="$(npm whoami --registry https://registry.npmjs.org/)"
          npm owner ls ui-style-kit-css --registry https://registry.npmjs.org/ | awk '{print $1}' | grep -Fx "${publisher}"
          npm publish ./ui-style-kit-css-2.9.0.tgz --access public --ignore-scripts --registry https://registry.npmjs.org/
      - name: Verify public bytes and create the matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The built-in token prevents tag/release writes from starting the legacy CI publishers.
        run: |
          node "$RUNNER_TEMP/publish-guided-corners.mjs" readback
          node "$RUNNER_TEMP/publish-guided-corners.mjs" release
