<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UI Style Kit CSS</title>
  <desc id="desc">Open Graph image for UI Style Kit CSS demo page.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1080" cy="90" r="170" fill="#0ea5e9" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="120" cy="560" r="220" fill="#22d3ee" opacity="0.14" filter="url(#softGlow)" />
  <rect x="80" y="72" width="1040" height="486" rx="34" fill="#0b1220" opacity="0.85" />
  <rect x="120" y="118" width="196" height="196" rx="42" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.4" />
  <rect x="156" y="162" width="126" height="30" rx="10" fill="#f8fafc" />
  <rect x="156" y="206" width="94" height="18" rx="7" fill="#bae6fd" />
  <rect x="156" y="234" width="118" height="18" rx="7" fill="#67e8f9" />
  <text x="350" y="220" font-size="68" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#f8fafc" font-weight="700">UI Style Kit CSS</text>
  <text x="350" y="280" font-size="34" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#cbd5e1">
    11 UI systems · 10 themes · light/dark/contrast
  </text>
  <rect x="350" y="322" width="700" height="8" rx="4" fill="url(#accent)" opacity="0.95" />
  <text x="350" y="380" font-size="28" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#e2e8f0">
    CSS-only visual style library demo on GitHub Pages
  </text>
  <g fill="#93c5fd" opacity="0.95">
    <rect x="350" y="430" width="120" height="44" rx="14" />
    <rect x="484" y="430" width="120" height="44" rx="14" />
    <rect x="618" y="430" width="120" height="44" rx="14" />
  </g>
</svg>
