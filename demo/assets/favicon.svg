<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">UI Style Kit CSS favicon</title>
  <desc id="desc">Layered gradient rounded-square icon with a white U.</desc>
  <defs>
    <linearGradient id="g1" x1="12%" y1="86%" x2="88%" y2="14%">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="37%" stop-color="#8b5cff"/>
      <stop offset="72%" stop-color="#5f6cff"/>
      <stop offset="100%" stop-color="#22d8d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b55"/>
      <stop offset="45%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#22cfff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="18" dy="28" stdDeviation="22" flood-color="#03071f" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="132" y="226" width="610" height="610" rx="126" transform="rotate(-7 437 531)" fill="url(#g1)" opacity="0.82"/>
    <rect x="184" y="158" width="650" height="650" rx="130" transform="rotate(-4 509 483)" fill="url(#g2)" opacity="0.92"/>
    <rect x="196" y="104" width="660" height="660" rx="136" transform="rotate(-4 526 434)" fill="url(#g1)"/>
  </g>
  <text x="512" y="668" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="560" font-weight="900" fill="#ffffff">U</text>
</svg>
