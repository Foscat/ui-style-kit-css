  <style>
    .demo-controls { position: sticky; top: 0; z-index: 1000; display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .75rem; padding: 1rem; background: Canvas; color: CanvasText; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); }
    .demo-controls label { display: grid; gap: .25rem; font: 700 .85rem system-ui; }
    .demo-controls select { min-height: 2.5rem; padding: .5rem; font: inherit; }
  </style>
</head>
<body data-ui="minimal-saas" data-theme="arctic-indigo" data-mode="light">
  <a id="skip" class="saas-skip-link" href="#main">Skip to content</a>
  <aside class="demo-controls" aria-label="Demo controls">
    <label>UI Style<select id="uiSelect"><option value="minimal-saas" data-prefix="saas">Minimal SaaS</option><option value="bento" data-prefix="bento">Bento UI</option><option value="maximalist" data-prefix="max">Maximalist / Playful</option><option value="bauhaus" data-prefix="bau">Bauhaus / Swiss Modern</option><option value="tactile" data-prefix="tactile">Skeuomorphic / Tactile</option><option value="neumorphism" data-prefix="neo">Neumorphism</option><option value="retrofuturism" data-prefix="retro">Retrofuturism</option><option value="brutalism" data-prefix="brutal">Brutalism</option><option value="cyberpunk" data-prefix="cyber">Cyberpunk</option><option value="y2k" data-prefix="y2k">Y2K</option><option value="retro-glass" data-prefix="rg">Retro Glass</option></select></label>
    <label>Color Theme<select id="themeSelect"><option value="midnight-gold">midnight-gold</option><option value="ocean-steel">ocean-steel</option><option value="forest-moss">forest-moss</option><option value="sunset-ember">sunset-ember</option><option value="royal-plum">royal-plum</option><option value="graphite-cyan">graphite-cyan</option><option value="desert-sage">desert-sage</option><option value="rose-quartz">rose-quartz</option><option value="cyber-lime">cyber-lime</option><option value="arctic-indigo">arctic-indigo</option></select></label>
    <label>Mode<select id="modeSelect"><option value="light">light</option><option value="dark">dark</option><option value="contrast">contrast</option></select></label>
  </aside>
  <main id="main"></main>
  <script>
    const stylePrefixes = {"minimal-saas": "saas", "bento": "bento", "maximalist": "max", "bauhaus": "bau", "tactile": "tactile", "neumorphism": "neo", "retrofuturism": "retro", "brutalism": "brutal", "cyberpunk": "cyber", "y2k": "y2k", "retro-glass": "rg"};
    const styleTitles = {"minimal-saas": "Minimal SaaS", "bento": "Bento UI", "maximalist": "Maximalist / Playful", "bauhaus": "Bauhaus / Swiss Modern", "tactile": "Skeuomorphic / Tactile", "neumorphism": "Neumorphism", "retrofuturism": "Retrofuturism", "brutalism": "Brutalism", "cyberpunk": "Cyberpunk", "y2k": "Y2K", "retro-glass": "Retro Glass"};
    const uiSelect = document.getElementById('uiSelect');
    const themeSelect = document.getElementById('themeSelect');
    const modeSelect = document.getElementById('modeSelect');
    const main = document.getElementById('main');
    const skip = document.getElementById('skip');

    function render() {
      const ui = uiSelect.value;
      const p = stylePrefixes[ui];
      const title = styleTitles[ui];
      document.body.dataset.ui = ui;
      document.body.dataset.theme = themeSelect.value;
      document.body.dataset.mode = modeSelect.value;
      skip.className = `${p}-skip-link`;
      main.innerHTML = `
        <section class="${p}-page">
          <div class="${p}-container ${p}-stack">
            <nav class="${p}-nav" aria-label="Primary">
              <a class="${p}-nav-link is-active" href="#">Overview</a>
              <a class="${p}-nav-link" href="#components">Components</a>
              <a class="${p}-nav-link" href="#native">Native HTML</a>
              <a class="${p}-nav-link" href="#table">Table</a>
            </nav>

            <article class="${p}-card ${p}-hover-lift">
              <p class="${p}-kicker">${title}</p>
              <h1 class="${p}-title">UI Style Kit CSS</h1>
              <p class="${p}-subtitle">A CSS-only style kit with multiple UI systems, 10 shared color themes, light/dark/contrast modes, and native HTML coverage.</p>
              <div class="${p}-cluster">
                <button class="${p}-button ${p}-button-primary">Primary</button>
                <button class="${p}-button ${p}-button-secondary">Secondary</button>
                <button class="${p}-button">Neutral</button>
                <button class="${p}-icon-button" aria-label="Icon button">&#9733;</button>
                <span class="${p}-badge ${p}-badge-primary">Primary</span>
                <span class="${p}-badge ${p}-badge-warning">Warning</span>
              </div>
            </article>

            <section id="components" class="${p}-grid">
              <article class="${p}-card">
                <p class="${p}-kicker">Controls</p>
                <h2 class="${p}-heading">Form Components</h2>
                <label class="${p}-field"><span class="${p}-label">Project Name</span><input class="${p}-input" placeholder="Golden Goose Website" /></label>
                <label class="${p}-field"><span class="${p}-label">Message</span><textarea class="${p}-textarea" placeholder="Write something useful..."></textarea></label>
                <label class="${p}-switch"><input type="checkbox" checked><span class="${p}-switch-track"><span class="${p}-switch-thumb"></span></span><span>Enabled</span></label>
              </article>

              <article class="${p}-card">
                <p class="${p}-kicker">Status</p>
                <h2 class="${p}-heading">Alerts + Progress</h2>
                <div class="${p}-alert ${p}-alert-success"><p class="${p}-alert-title">Success</p><p class="${p}-alert-body">The package stylesheet is loaded.</p></div>
                <div class="${p}-progress" aria-label="Progress"><div class="${p}-progress-bar" style="--${p}-progress-value: 68%"></div></div>
                <div class="${p}-cluster"><span class="${p}-badge ${p}-badge-success">Success</span><span class="${p}-badge ${p}-badge-danger">Danger</span></div>
              </article>

              <article class="${p}-well">
                <h2 class="${p}-heading">Surface Well</h2>
                <p class="${p}-copy">This inset/soft surface demonstrates secondary containers and grouped content.</p>
                <hr class="${p}-divider" />
                <p><code>data-ui="${ui}"</code> <code>data-theme="${themeSelect.value}"</code> <code>data-mode="${modeSelect.value}"</code></p>
              </article>
            </section>

            <section id="native" class="${p}-card">
              <h2>Native HTML Coverage</h2>
              <p>This paragraph, <a href="#native">link</a>, <mark>marked text</mark>, <code>inline code</code>, <kbd>Ctrl</kbd> + <kbd>S</kbd>, and <abbr title="Accessible Rich Internet Applications">ARIA</abbr> abbreviation are styled without utility classes.</p>
              <blockquote>CSS can improve presentation accessibility, but semantic HTML and keyboard-safe JavaScript are still required.</blockquote>
              <ul><li>Unordered list item</li><li>Another item</li></ul>
              <ol><li>Ordered list item</li><li>Another item</li></ol>
              <details><summary>Details and summary</summary><p>Native disclosure widgets are covered too.</p></details>
              <fieldset><legend>Native Fieldset</legend><label>Email <input type="email" placeholder="name@example.com"></label><br><label><input type="checkbox" checked> Receive updates</label><br><label><input type="radio" name="demo-radio" checked> Option A</label></fieldset>
              <label>Range <input type="range" value="62"></label>
              <progress value="72" max="100">72%</progress>
              <meter value="0.68">68%</meter>
            </section>

            <section id="table" class="${p}-table-wrap">
              <table class="${p}-table">
                <caption>Component coverage example</caption>
                <thead><tr><th>Element</th><th>State</th><th>Coverage</th></tr></thead>
                <tbody>
                  <tr><td>Button</td><td>Hover / active / disabled</td><td>Class + native</td></tr>
                  <tr><td>Input</td><td>Focus / invalid / disabled</td><td>Class + native</td></tr>
                  <tr><td>Table</td><td>Caption / header / hover</td><td>Class + native</td></tr>
                </tbody>
              </table>
            </section>
          </div>
        </section>`;
    }
    uiSelect.addEventListener('change', render);
    themeSelect.addEventListener('change', render);
    modeSelect.addEventListener('change', render);
    render();
  </script>
</body>
</html>
